org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# The screenshot convention derives each `:features:<x>:screenshot` module's package from its
# Gradle path (SAGE's namespaceFromPath()). `features` is structural, not part of the package.
sage.namespace.prefix=net.sigmabeta.sage.sample
sage.namespace.dropSegments=features

kotlin.code.style=official
