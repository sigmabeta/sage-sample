name: CI

# Push / PR checks for every branch. The jobs mirror scripts/ci/verify.sh, which runs the same
# Gradle tasks sequentially on a developer machine. There is no tag/release workflow yet: the
# release build type has no signing config, so a tag could only publish an unsigned APK.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    # Cheapest feedback first, and the gate for the two compile-heavy jobs below: a style or
    # detekt break fails here before a runner spends minutes compiling the app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint + detekt
        run: >-
          ./gradlew ktlintCheck detekt --continue
          --build-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore

  unit-test:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (app, feature modules, shared KMP)
        run: >-
          ./gradlew test
          -x :features:browse:screenshot:test
          -x :features:contentdetail:screenshot:test
          -x :features:home:screenshot:test
          -x :features:listitems:screenshot:test
          -x :features:search:screenshot:test
          -x :features:settings:screenshot:test
          :core:bitmaps:jvmTest :core:strings:real:jvmTest :core:ui:shell:jvmTest --continue
          --build-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/build/test-results/**/TEST-*.xml'
          if-no-files-found: ignore

  screenshot:
    # Paparazzi verifies the committed LFS goldens, so this checkout — unlike the others — must
    # fetch LFS objects. The generic unit-test job deliberately excludes the screenshot modules.
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Paparazzi snapshots
        run: >-
          ./gradlew verifyPaparazziDebug --continue
          --build-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paparazzi-diffs
          path: '**/build/paparazzi/**'
          if-no-files-found: ignore

  jvm-app:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compose Desktop app jar
        run: ./gradlew :apps:jvm:assemble --build-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-app
          path: 'apps/jvm/build/libs/**'
          if-no-files-found: ignore

  android:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu runners ship with the SDK, but the compile platform is not guaranteed to be
      # present. `packages` is overridden because the action's default requests the legacy
      # `tools` package, which Google removed from the SDK repository.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      # lintRelease compiles the release graph, so running it before the APKs makes the
      # subsequent assemble steps incremental on this runner.
      - name: Android lint + debug/release APKs
        run: >-
          ./gradlew :apps:android:lintRelease :apps:android:assembleDebug :apps:android:assembleRelease
          --build-cache --no-daemon --max-workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: 'apps/android/build/reports/**'
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: 'apps/android/build/outputs/apk/**/*.apk'
          if-no-files-found: ignore
